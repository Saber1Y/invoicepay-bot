[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

# BOT Chain endpoints (see README)
[rpc_endpoints]
bot_testnet = "https://rpc.bohr.life"
bot_mainnet = "https://rpc.botchain.ai"

[etherscan]
bot_testnet = { key = "verifyContract", url = "https://bohrscan.com/api", chain = 968 }
bot_mainnet = { key = "verifyContract", url = "https://scan.botchain.ai/api", chain = 677 }
